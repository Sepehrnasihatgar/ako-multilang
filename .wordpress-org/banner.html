<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;src:url(../assets/fonts/Inter-Variable.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:V;src:url(../assets/fonts/Vazirmatn-Variable.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:772px;height:250px;overflow:hidden;background:#0f271b;font-family:I,V,sans-serif;color:#f0f9f4;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(520px 260px at 82% 50%,#1c4a33 0%,rgba(15,39,27,0) 70%)}
.left{position:absolute;left:44px;top:50%;transform:translateY(-50%);width:380px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand b{font-size:26px;font-weight:650;letter-spacing:-.02em}
.brand span{font-size:26px;font-weight:400;color:#60ae85;letter-spacing:-.02em}
h1{font-size:19px;line-height:26px;font-weight:500;color:#e0f2e7;letter-spacing:-.01em}
p{margin-top:12px;font-size:13px;color:#60ae85;font-weight:500;letter-spacing:.01em}
.cards{position:absolute;right:40px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px}
.card{width:132px;background:#f7f8f5;border-radius:12px;padding:14px 14px 16px;color:#181815;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.tag{display:inline-block;font-size:10px;font-weight:650;background:#e0f2e7;color:#1c4a33;border-radius:5px;padding:2px 6px;margin-bottom:10px}
.t{font-size:14px;font-weight:600;margin-bottom:9px}
.l{height:6px;border-radius:3px;background:#e3e3df;margin-top:6px}
.rtl{direction:rtl;text-align:right}
.rtl .t{font-family:V;font-weight:700}
.link{width:34px;height:34px;border-radius:50%;background:#3d8c64;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(61,140,100,.25)}
.url{font-size:10px;color:#666662;font-family:ui-monospace,Menlo,monospace;margin-bottom:8px;direction:ltr;text-align:inherit}
</style></head><body><div class="glow"></div>
